openapi: 3.0.3
info:
  title: recipe-voice-app API
  version: 0.1.0
  description: |
    음성 인식 기반 레시피 모음집 앱의 백엔드 API 계약.
    모바일 클라이언트는 이 문서를 openapi-typescript로 컴파일해 타입을 공유한다 (ticketrush/web-fe 관행 재사용).
servers:
  - url: http://localhost:4000
security:
  - bearerAuth: []
paths:
  /api/auth/register:
    post:
      security: []
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: 가입 성공, JWT 반환
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthToken" }
  /api/auth/login:
    post:
      security: []
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: 로그인 성공, JWT 반환
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthToken" }

  /api/recipes:
    get:
      summary: 레시피 목록 조회
      responses:
        "200":
          description: 레시피 요약 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecipeSummary" }
    post:
      summary: 레시피 생성 (직접 입력)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }

  /api/recipes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: 레시피 상세 조회
      responses:
        "200":
          description: 레시피 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeDetail" }
        "404": { description: 존재하지 않음 }
    patch:
      summary: 즐겨찾기 등 부분 수정
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isFavorite: { type: boolean }
      responses:
        "204": { description: 수정됨 }
    delete:
      summary: 소프트 삭제
      responses:
        "204": { description: 삭제됨 }

  /api/sync/pull:
    get:
      summary: 마지막 동기화 이후 변경분 조회
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 변경된 레시피 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipes:
                    type: array
                    items: { $ref: "#/components/schemas/RecipeDetail" }
                  syncedAt: { type: string, format: date-time }

  /api/sync/push:
    post:
      summary: 로컬 sync_queue 배치 업로드
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      operation: { type: string, enum: [create, update, delete] }
                      entityId: { type: string, format: uuid }
                      payload: { type: object }
      responses:
        "200":
          description: 적용 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  appliedCount: { type: integer }
                  syncedAt: { type: string, format: date-time }

  /api/voice/intent:
    post:
      summary: 온디바이스 로컬 매처가 실패한 발화의 온라인 인텐트 추정 (텍스트만 전송)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
      responses:
        "200":
          description: 추정된 인텐트
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CookModeIntent" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    AuthToken:
      type: object
      properties:
        token: { type: string }
    Ingredient:
      type: object
      properties:
        name: { type: string }
        quantity: { type: number, nullable: true }
        unit: { type: string, nullable: true }
    Step:
      type: object
      properties:
        text: { type: string }
        timerSeconds: { type: integer, nullable: true }
    RecipeInput:
      type: object
      required: [title, source, ingredients, steps, tags]
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        totalTimeMinutes: { type: integer, nullable: true }
        servings: { type: integer, nullable: true }
        source: { type: string, enum: [voice, manual] }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/Ingredient" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/Step" }
        tags:
          type: array
          items: { type: string }
    RecipeSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        totalTimeMinutes: { type: integer, nullable: true }
        isFavorite: { type: boolean }
    RecipeDetail:
      allOf:
        - $ref: "#/components/schemas/RecipeSummary"
        - $ref: "#/components/schemas/RecipeInput"
    CookModeIntent:
      type: object
      properties:
        type:
          type: string
          enum: [NEXT_STEP, PREV_STEP, REPEAT_STEP, LIST_INGREDIENTS, START_TIMER, UNKNOWN]
        seconds: { type: integer, nullable: true }
