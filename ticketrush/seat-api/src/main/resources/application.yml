server:
  port: 8082

spring:
  application:
    name: seat-api
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketrush
    username: ticketrush
    password: ticketrush
    hikari:
      maximum-pool-size: 20   # 10→20: W5 consumer lag 분석 결과 반영 (w5-kafka-consumer-lag-analysis.md)
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: seat-api
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 200
      fetch-min-size: 1
      fetch-max-wait: 500ms
      heartbeat-interval: 3000ms
      session-timeout: 15000ms

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
