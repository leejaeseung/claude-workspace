openapi: "3.1.0"
info:
  title: TicketRush API
  version: "0.1.0"
  description: 실시간 티켓팅 플랫폼 API

paths:
  /queue/enter:
    post:
      summary: 대기열 진입
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, showId]
              properties:
                userId: { type: string }
                showId: { type: integer, format: int64 }
      responses:
        "202":
          description: 대기열 진입 수락
          content:
            application/json:
              schema:
                type: object
                properties:
                  position: { type: integer }
                  estimatedWaitSeconds: { type: integer }

  /queue/status/{userId}:
    get:
      summary: 대기 순번 조회
      tags: [Queue]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: showId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 대기 순번 정보
          content:
            application/json:
              schema:
                type: object
                properties:
                  position: { type: integer }
                  estimatedWaitSeconds: { type: integer }

  /seats/{seatId}/lock:
    post:
      summary: 좌석 점유
      tags: [Seat]
      parameters:
        - name: seatId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, showId]
              properties:
                userId: { type: string }
                showId: { type: integer, format: int64 }
      responses:
        "200":
          description: 좌석 점유 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  seatId: { type: integer, format: int64 }
                  userId: { type: string }
                  expiresAt: { type: string, format: date-time }
        "409":
          description: 이미 점유된 좌석
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      summary: 좌석 해제
      tags: [Seat]
      parameters:
        - name: seatId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: 좌석 해제 성공 }

  /orders:
    post:
      summary: 주문 생성
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, seatId, showId]
              properties:
                userId: { type: string }
                seatId: { type: integer, format: int64 }
                showId: { type: integer, format: int64 }
      responses:
        "201":
          description: 주문 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

  /orders/{orderId}:
    get:
      summary: 주문 조회
      tags: [Order]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 주문 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

  /payments:
    post:
      summary: 결제 요청
      tags: [Payment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, seatId, showId, userId, idempotencyKey]
              properties:
                orderId: { type: integer, format: int64 }
                seatId: { type: integer, format: int64 }
                showId: { type: integer, format: int64 }
                userId: { type: string }
                idempotencyKey: { type: string, format: uuid }
      responses:
        "200":
          description: 결제 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId: { type: integer, format: int64 }
                  status: { type: string, enum: [COMPLETED, FAILED] }
        "409":
          description: 이미 처리된 결제
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  schemas:
    OrderResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: string }
        seatId: { type: integer, format: int64 }
        showId: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, CONFIRMED, EXPIRED, CANCELLED] }
        totalAmount: { type: integer, format: int64 }
    ProblemDetail:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
