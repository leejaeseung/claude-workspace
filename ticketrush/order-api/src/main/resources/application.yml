server:
  port: 8083

spring:
  application:
    name: order-api
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketrush
    username: ticketrush
    password: ticketrush
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-api
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 200
      heartbeat-interval: 3000ms
      session-timeout: 15000ms

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
